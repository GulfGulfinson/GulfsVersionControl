[workspace]
members = [
    "gvc-core",
    "gvc-cli",
    "gvc-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GulfsVersionControl Team"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies across workspace
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
chrono = "0.4"
walkdir = "2.4"
toml = "0.8"
dirs = "5.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Server
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"

