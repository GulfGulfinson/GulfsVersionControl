[module]
name = "rust-linter"
version = "1.0.0"
description = "Validates Rust code with cargo clippy before commits"
authors = ["GVC Team"]
license = "MIT"
keywords = ["rust", "linter", "clippy", "validation"]

[hooks]
pre-commit = "hooks/clippy-check.sh"
post-commit = "hooks/notify.sh"

[config]
clippy_args = ["-D", "warnings"]
skip_tests = false

